<template>
        <lightning-card title="All Account">
            
            <ul>
                <template if:true={responseReceived}>
                    <template for:each={accounts.data} for:item="account">
                        <li key={account.id}>
                            <div class = "slds-p-around_medium">
                                <lightning-tile label={account.Name}>
                                    <p class="slds-truncate" title={account.Phone}>{account.Phone}</p>
                                    <p class="slds-truncate" title={account.AnnualRevenue}>{account.AnnualRevenue}</p>
                                </lightning-tile>
                            </div>
                        </li>
                    </template>
                </template>
            </ul>
        </lightning-card>
        
    </template>
